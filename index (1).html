<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Race Split Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Splits">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#7a1428">
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1b1b1a;--mut:#77756e;--ac:#7a1428;--act:#7a1428;--ln:#e4e2db;--ok:#2b8a3e;--bad:#c92a2a;--wn:#f0b400;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151514;--card:#222220;--tx:#f1efe8;--mut:#a09d92;--ac:#7a1428;--act:#f1efe8;--ln:#35342f;--ok:#69db7c;--bad:#ff8787;--wn:#ffd43b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151514;--card:#222220;--tx:#f1efe8;--mut:#a09d92;--ac:#7a1428;--act:#f1efe8;--ln:#35342f;--ok:#69db7c;--bad:#ff8787;--wn:#ffd43b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,button,input,select,label,summary,.tab,.chk,.lap{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
body.dragging,body.dragging *{user-select:none;-webkit-user-select:none;cursor:grabbing!important}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:18px;margin:0 0 8px}
.list{position:relative}
.row{height:56px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:0 12px 0 0;margin-bottom:8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.row input.gi{flex:none;width:92px;padding:7px 8px;margin:0;font-size:15px;text-align:center;-webkit-user-select:text;user-select:text}
.row.g-ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.row.g-near{border-color:var(--wn);background:color-mix(in srgb,var(--wn) 22%,var(--card))}
.row.g-bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.gd{font-weight:700;color:var(--tx);margin-right:6px}.gd:empty{display:none}
.row.drag{background:color-mix(in srgb,var(--ac) 16%,var(--card));border-color:var(--ac);box-shadow:0 8px 22px #0005;z-index:5;position:relative}
.h{touch-action:none;cursor:grab;font-size:22px;color:var(--tx);background:color-mix(in srgb,var(--ln) 60%,transparent);border-radius:10px 0 0 10px;padding:0 12px;height:100%;display:flex;align-items:center;user-select:none;-webkit-user-select:none}
.row.drag .h{color:var(--act)}
.row.mr{padding-left:14px}
.nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm small{display:block;font-weight:400;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis}
.x{background:none;border:0;color:var(--mut);font-size:24px;cursor:pointer;padding:0 6px}
.add{display:flex;gap:8px;margin-bottom:12px;align-items:center}
input,select{flex:1;min-width:0;width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
.add input{width:auto}
.add .sm{flex:0 0 100px}
.add .lb{flex:1;font-weight:600}
button.p{font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--ac);color:#fff;padding:12px 18px;cursor:pointer}
button.p:disabled{opacity:.4}
button.s{font:inherit;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);padding:10px 16px;cursor:pointer}
.hint{color:var(--mut);font-size:14px;margin:0 0 10px}
.clock{font:700 56px/1.1 ui-monospace,Menlo,monospace;text-align:center;margin:8px 0}
.lap{width:100%;height:96px;font-size:26px;border-radius:16px;margin-bottom:12px}
.bar{display:flex;gap:8px;margin-bottom:12px}.bar>*{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}
.tab{flex:none;font:inherit;font-size:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.bar .tab{padding:12px 14px;font-size:16px}
.tw{position:relative;margin-bottom:10px}
.tw .tabs{margin-bottom:0;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.tw .tabs::-webkit-scrollbar{display:none}
.tar{position:absolute;top:0;bottom:4px;width:40px;border:0;padding:0;color:var(--tx);font:700 26px/1 system-ui,sans-serif;cursor:pointer;display:none;align-items:center}
.tar.l{left:0;justify-content:flex-start;padding-left:6px;background:linear-gradient(90deg,var(--bg) 35%,transparent)}
.tar.r{right:0;justify-content:flex-end;padding-right:6px;background:linear-gradient(270deg,var(--bg) 35%,transparent)}
.tw.cl .tar.l,.tw.cr .tar.r{display:flex}
#kbd{position:fixed;right:12px;z-index:200;display:none;padding:10px 18px;border-radius:999px;border:0;background:var(--ac);color:#fff;font:700 16px system-ui,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.grid{display:flex;gap:8px}
.slots{width:100px;flex:none}
.slot{height:56px;margin-bottom:8px;display:flex;flex-direction:column;justify-content:center;padding-left:4px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.slot b{font-size:15px;font-family:system-ui,sans-serif}
.slot small{color:var(--mut);font-size:12px}
.slot span[data-ti]{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
#act{flex:1;min-width:0}
.b{font-size:13px;font-weight:700;white-space:nowrap}
.up{color:var(--ok)}.dn{color:var(--bad)}.eq{color:var(--mut)}
.pd{color:var(--mut);font-size:12px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.card ol{margin:6px 0 0;padding-left:22px}.card li{padding:2px 0;font-weight:600}
.ov{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:20}
.mdl{background:var(--card);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto}
.rr{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--ln);padding:4px 0;font-weight:600}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.rr input{margin:4px 8px 4px 0;padding:8px 10px;font-weight:600}
.seg{display:flex;background:var(--card);border:1px solid var(--ln);border-radius:999px;padding:4px;margin-bottom:14px}
.seg button{flex:1;font:inherit;font-weight:700;border:0;background:none;color:var(--mut);padding:10px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
input[type=checkbox]{width:22px;height:22px;flex:none;padding:0}
.chk{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px;margin:0 0 8px;font-weight:600;font-size:16px;color:var(--tx);cursor:pointer}
.flash{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));background:var(--ac);color:#fff;padding:10px 16px;border-radius:999px;font-weight:700;z-index:30;display:none;box-shadow:0 4px 14px #0004;white-space:nowrap}
textarea{background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px;font-family:ui-monospace,Menlo,monospace}
summary{cursor:pointer;margin:8px 0}
.cr{text-align:center;margin:18px 0 6px}
.lnk{font:inherit;font-size:13px;background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;padding:8px}
.lic{font-size:11px;white-space:pre-wrap;color:var(--mut);margin:6px 0 0}
.lvb{text-align:center;margin:-4px 0 10px}
</style></head><body><main id="app"></main><div id="modal"></div>


<!-- Third-party code: qrgen.js (MIT, Kazuhiko Arase), jsQR.js (Apache-2.0, Cosmo Wolfe and contributors). See THIRD-PARTY-LICENSES.txt -->
<script src="firebase-config.js"></script>
<script src="qrgen.js"></script>
<script src="jsQR.js"></script>
<script>
const $=s=>document.querySelector(s);
function newLv(){return{hid:'',dirty:0,ver:0,sig:'',src:{},hts:{},orid:'',o:null}}
function loadOff(){try{const v=localStorage.getItem('rst-offline-v1');return v!=='0'}catch(e){return true}}
let S={phase:'setup',raceName:'',order:[],pred:[],marks:[],def:{label:'Marker 1',dist:''},total:'',unit:'mi',markers:[],cur:0,start:0,final:0,raf:0,nid:1,rid:'',epoch:0,flash:'',invRid:'',munit:'mi',tdraft:'',hinv:null,hsel:[],hm:[],hc:0,modal:null,draft:null,goals:{},lv:newLv(),offline:loadOff()};
const M=()=>S.markers[S.cur];
const mks=()=>S.marks.length?S.marks:[S.def];
const fmt=ms=>{const t=Math.floor(ms/10),c=t%100,s=Math.floor(t/100)%60,m=Math.floor(t/6000);return m+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0')};
const fmtE=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const parse=s=>{s=String(s).trim();if(!s)return null;
  // Periods work as separators so the number pad is enough: 16.49 = 16:49, 16.49.00 = 16:49.00 (min.sec.hundredths)
  if(!s.includes(':')&&s.includes('.')){const q=s.split('.');if(q.length>3||q.some(x=>!/^\d+$/.test(x)))return null;
    const mi=+q[0],se=+q[1],cs=q[2]?+q[2].padEnd(2,'0').slice(0,2):0;if(se>=60)return null;return Math.round((mi*60+se+cs/100)*1000)}
  const p=s.split(':');let v;if(p.length===2)v=(+p[0])*60+(+p[1]);else if(p.length===1)v=+p[0];else return null;return isNaN(v)||v<0?null:Math.round(v*1000)};
const now=()=>S.phase==='race'?performance.now()-S.start:S.final;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const byId=id=>S.order.find(p=>p.id==id);
const ord=i=>(i+1)+(['st','nd','rd'][i]||'th');
const timeAt=(mk,id)=>{const i=mk.actual.indexOf(id);return i>=0&&mk.laps[i]!=null?mk.laps[i]:null};
const KMF=u=>u==='mi'?1.609344:u==='m'?0.001:1;
const distKm=k=>(+k.dist>0?+k.dist:0)*KMF(k.unit||S.unit);
const totKm=()=>(+S.total>0?+S.total:0)*KMF(S.unit);
const relabel=(k,i)=>{const d=String(k.dist).trim();k.label=d!==''?(+d>0?String(+d):d)+' '+(k.unit||S.unit):'Marker '+(i+1)};
// Every timed point for a runner at markers that have a distance, nearest first to the start.
function pts(id){const a=[];S.markers.forEach(mk=>{const d=distKm(mk),t=timeAt(mk,id);if(d>0&&t!=null&&t>0)a.push({d,t})});a.sort((x,y)=>x.d-y.d);return a}
// Pace from the gap between a runner's two most recent splits (or start -> first split if they only have one).
function recentPace(id){const a=pts(id);if(!a.length)return null;const p2=a[a.length-1],p1=a.length>1?a[a.length-2]:{d:0,t:0};if(p2.d<=p1.d||p2.t<=p1.t)return null;return{pace:(p2.t-p1.t)/(p2.d-p1.d),d:p2.d,t:p2.t}}
// Goal pacing, judged at the marker you are viewing so old markers never change when later splits come in.
// Red = any amount behind goal pace. Yellow = ahead, but within GOAL_TOL of the time they should have by that point (min 3 s),
// so the "close to falling behind" window grows with distance. Green = comfortably ahead.
const GOAL_TOL=0.02;
const fg=ms=>{const t=fmt(ms);return t.endsWith('.00')?t.slice(0,-3):t};
function goalState(id,ms){
  const g=S.goals[id],D=totKm();if(!(g>0)||!(D>0))return null;
  const mk=M(),cd=distKm(mk),ex=d=>g*Math.min(d,D)/D,own=timeAt(mk,id);
  let diff=null,exp=0;
  if(cd>0&&own!=null&&own>0){exp=ex(cd);diff=own-exp}
  else{
    const a=pts(id).filter(p=>!(cd>0)||p.d<cd);
    if(a.length){const p=a[a.length-1];exp=ex(p.d);diff=p.t-exp}
    if(S.phase==='race'&&cd>0){const e=ex(cd);if(ms>e&&(diff==null||ms-e>diff)){diff=ms-e;exp=e}}
  }
  if(diff==null)return null;
  return{diff,st:diff>0?'bad':diff>=-Math.max(3000,exp*GOAL_TOL)?'near':'ok'};
}
function goalText(id,ms){const g=S.goals[id];if(!(g>0))return'';const s=goalState(id,ms);return s?(s.diff>0?'+':'−')+fmtE(Math.abs(s.diff)):'Goal '+fmtE(g)}
function updGoals(){
  const ms=now(),mk=M();
  document.querySelectorAll('#act .row[data-id]').forEach(r=>{
    const id=+r.dataset.id;
    // Over/under goal only after this runner has a split at the current marker
    const has=timeAt(mk,id)!=null;
    const s=has?goalState(id,ms):null;
    r.classList.remove('g-ok','g-near','g-bad');if(s)r.classList.add('g-'+s.st);
    const gd=r.querySelector('.gd');if(gd)gd.textContent=has&&s?goalText(id,ms):'';
  });
}

function sortable(el,done){
  el.querySelectorAll('.h').forEach(h=>{
    h.addEventListener('contextmenu',e=>e.preventDefault());
    h.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button!==0)return;
      e.preventDefault();
      const row=h.closest('.row'),rows=[...el.children],from=rows.indexOf(row);
      if(from<0)return;
      const rects=rows.map(r=>r.getBoundingClientRect()),mids=rects.map(r=>r.top+r.height/2);
      const startY=e.clientY,sy0=window.scrollY,pid=e.pointerId;
      const minDy=rects[0].top-rects[from].top,maxDy=rects[rows.length-1].top-rects[from].top;
      let to=from,over=false;
      row.classList.add('drag');document.body.classList.add('dragging');
      rows.forEach(r=>{r.style.transition=r===row?'none':'transform .12s'});
      try{h.setPointerCapture(pid)}catch(_){}
      const place=()=>rows.forEach((r,i)=>{
        if(r===row)return;
        let dy=0;
        if(from<to&&i>from&&i<=to)dy=rects[i-1].top-rects[i].top;
        else if(from>to&&i>=to&&i<from)dy=rects[i+1].top-rects[i].top;
        r.style.transform=dy?`translateY(${dy}px)`:'';
      });
      const move=ev=>{
        if(ev.pointerId!==pid)return;
        const dy=Math.max(minDy,Math.min(maxDy,ev.clientY-startY+(window.scrollY-sy0)));
        row.style.transform=`translateY(${dy}px) scale(1.02)`;
        const c=mids[from]+dy;let best=0,bd=1e9;
        for(let i=0;i<mids.length;i++){const d=Math.abs(c-mids[i]);if(d<bd){bd=d;best=i}}
        if(best!==to){to=best;place()}
      };
      const end=ev=>{
        if(over)return;
        if(ev&&ev.pointerId!==undefined&&ev.pointerId!==pid)return;
        over=true;
        window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',end);
        window.removeEventListener('pointercancel',end);window.removeEventListener('blur',end);
        document.removeEventListener('visibilitychange',end);h.removeEventListener('lostpointercapture',end);
        try{h.releasePointerCapture(pid)}catch(_){}
        rows.forEach(r=>{r.style.transition='none';r.style.transform=''});
        row.classList.remove('drag');document.body.classList.remove('dragging');
        const ids=rows.map(r=>r.dataset.id);ids.splice(from,1);ids.splice(to,0,rows[from].dataset.id);
        done(ids);
      };
      window.addEventListener('pointermove',move);window.addEventListener('pointerup',end);
      window.addEventListener('pointercancel',end);window.addEventListener('blur',end);
      document.addEventListener('visibilitychange',end);h.addEventListener('lostpointercapture',end);
    });
  });
}
// Keep each runner's time on their id when the list is dragged, then put timed runners first in the new order.
function srvNow(){return Date.now()+((typeof FB!=='undefined'&&FB.so)||0)}
function reorderWithTimes(ids,actual,times){
  const timeById=new Map();
  for(let i=0;i<times.length;i++)if(times[i]!=null)timeById.set(+actual[i],times[i]);
  const newIds=ids.map(Number);
  const timed=newIds.filter(id=>timeById.has(+id));
  const rest=newIds.filter(id=>!timeById.has(+id));
  return{actual:[...timed,...rest],times:timed.map(id=>timeById.get(+id))};
}

function render(){draw();renderModal();flashUI();liveTick();saveState()}

function tabsHTML(inner){return `<div class="tw" id="tw"><div class="tabs" id="mtabs">${inner}</div><button class="tar l" id="tabl" aria-label="Scroll markers left">‹</button><button class="tar r" id="tabr" aria-label="Scroll markers right">›</button></div>`}
function initTabs(sl){
  const sc=$('#mtabs'),w=$('#tw');if(!sc||!w)return;
  sc.scrollLeft=sl||0;
  const upd=()=>{w.classList.toggle('cl',sc.scrollLeft>2);w.classList.toggle('cr',sc.scrollLeft+sc.clientWidth<sc.scrollWidth-2)};
  // keep the selected marker in view, but only move if it is actually off-screen
  const on=sc.querySelector('.tab.on');
  if(on){const c=sc.getBoundingClientRect(),t=on.getBoundingClientRect();
    if(t.left<c.left+8)sc.scrollLeft-=c.left+8-t.left;
    else if(t.right>c.right-8)sc.scrollLeft+=t.right-(c.right-8)}
  sc.addEventListener('scroll',upd,{passive:true});
  $('#tabl').onclick=()=>sc.scrollBy({left:-sc.clientWidth*0.6,behavior:'smooth'});
  $('#tabr').onclick=()=>sc.scrollBy({left:sc.clientWidth*0.6,behavior:'smooth'});
  upd();
}
function draw(){const old=$('#mtabs'),sl=old?old.scrollLeft:0;draw0();liveBadge();bindOff();if(S.phase==='htime')hUpdate(true);initTabs(sl)}
window.addEventListener('resize',()=>{const w=$('#tw'),sc=$('#mtabs');if(w&&sc){w.classList.toggle('cl',sc.scrollLeft>2);w.classList.toggle('cr',sc.scrollLeft+sc.clientWidth<sc.scrollWidth-2)}});
const marksHTML=()=>S.marks.map((k,i)=>`<div class="row mr"><span class="nm">${esc(k.label)}</span><button class="x" data-m="${i}" aria-label="Remove ${esc(k.label)}">×</button></div>`).join('');
function draw0(){
  if(S.phase[0]==='h')return drawHelper();
  const a=$('#app');
  if(S.phase==='setup'){
    a.innerHTML=`<h1>Race Split Taker</h1>
    ${modeSeg('org')}${offToggle()}${unlockTimeHTML()}
    <label for="racename">Race name</label><input id="racename" value="${esc(S.raceName||'')}" placeholder="e.g. County Championships" autocomplete="off">
    <div class="bar"><button class="s" id="scn">Import splits</button><button class="s" id="hst">Saved races</button></div>
    <div class="bar"><button class="s" id="tms">Team presets</button></div>
    <div class="add"><input id="in" placeholder="Add a name" autocomplete="off"><button class="p" id="addb">Add</button></div>
    <p class="hint">Press and drag ⇅ to put runners in your predicted finishing order (top = first). Optional: type a goal finish time next to a name (16:49 or 16.49).</p>
    <div class="list" id="lst">${S.order.map(p=>`<div class="row" data-id="${p.id}"><span class="h">⇅</span><span class="nm">${esc(p.name)}</span><input class="gi" data-gi="${p.id}" value="${S.goals[p.id]>0?fg(S.goals[p.id]):''}" placeholder="Goal" inputmode="text" autocomplete="off" autocapitalize="off" aria-label="Goal time for ${esc(p.name)}"><button class="x" data-x="${p.id}">×</button></div>`).join('')}</div>
    <h1 style="font-size:16px;margin-top:18px">Markers</h1>
    <p class="hint">Add each point where you’ll take splits by its distance. They sort themselves, and you can mix miles, kilometers, and meters.</p>
    <div class="add"><input id="mdist" type="text" inputmode="decimal" placeholder="Distance" autocomplete="off" autocapitalize="off"><select id="munit" class="sm"><option value="mi" ${S.munit==='mi'?'selected':''}>mi</option><option value="km" ${S.munit==='km'?'selected':''}>km</option><option value="m" ${S.munit==='m'?'selected':''}>m</option></select><button class="p" id="addmk">Add</button></div>
    <div class="list" id="mlst">${marksHTML()}</div>
    <button class="p" id="go" style="width:100%;margin-top:6px" ${S.order.length<1?'disabled':''}>Continue</button>
    <p class="cr"><button class="lnk" id="crd">Credits &amp; licenses</button></p>`;
    const refocus=id=>{requestAnimationFrame(()=>{const el=$(id);if(!el)return;el.focus();try{el.setSelectionRange&&el.setSelectionRange(0,el.value.length)}catch(e){}})};

function est(k){
  const L=M().laps,a=L[k-1],b=L[k];let t=null;
  if(a!=null&&b!=null)t=(a+b)/2;

  else if(b!=null)t=Math.max(0,b-1000);
  return t==null?'':fmt(t);
}

// Check an access code in Firebase: codes/{CODE} with expires (ms since 1970). The database rules enforce it on every write.
async function redeemUnlockCode(raw){
  const code=String(raw||'').trim().toUpperCase().replace(/\s+/g,'');
  if(!code)throw new Error('Enter a code');
  if(!/^[A-Z0-9][A-Z0-9_-]{2,31}$/.test(code))throw new Error('That doesn’t look like a valid code');
  if(!fbOK())throw new Error('Live sync isn’t set up in this copy of the app');
  if(!(await ensureFB())||!FB.db)throw new Error('No connection — try again online');
  if(!FB.conn){
    await new Promise(ok=>{let n=0;const t=setInterval(()=>{if(FB.conn||++n>30){clearInterval(t);ok()}},100)});
  }
  if(!FB.conn)throw new Error('No connection — try again online');
  let snap;
  try{
    // get() asks the server first (once() can answer from a stale local copy), so an extended code is seen right away.
    const cref=FB.db.ref('codes/'+code);
    snap=await (typeof cref.get==='function'?cref.get():cref.once('value'));
  }catch(e){
    if((e&&e.code)==='PERMISSION_DENIED')throw new Error('Database rules block codes — publish the rules from FIREBASE-SETUP.md');
    throw new Error((e&&e.message)||'Could not read code');
  }
  if(!snap.exists())throw new Error('Code not found — check the spelling and try again');
  const d=snap.val()||{};
  const until=+d.expires||0;
  const nowS=Date.now()+(+FB.so||0);
  if(!(until>0))throw new Error('This code has no expiry time — add an expires number to it in Firebase');
  if(!(until>nowS))throw new Error('This code expired '+new Date(until-(+FB.so||0)).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'. If you just extended it, check that expires is a number with 13 digits (milliseconds).');
  lsSet('rst-live-code',code);
  setLiveUntil(until-(+FB.so||0));
  return{until};
}

function encodeState(){

function fillMarker(L,actual,laps,dist){

  actual.forEach((id,i)=>{if(laps[i]!=null&&!have.has(id)){have.set(id,laps[i]);add++}});
  actual.forEach(id=>{if(!L.actual.includes(id))L.actual.push(id)});

async function startCam(){
  stopCam();const my=CAM={on:true,stream:null};
  const v=$('#vid'),msg=$('#sm');
  try{
    const hasJ=typeof jsQR!=='undefined';
    const det=(!hasJ&&'BarcodeDetector' in window)?new BarcodeDetector({formats:['qr_code']}):null;
    if(!hasJ&&!det){msg.textContent='The QR reader (jsQR.js) isn’t in this copy yet — paste the code instead.';return}
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('cam');
    msg.textContent='Starting camera…';
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    if(!my.on){st.getTracks().forEach(t=>t.stop());return}
    my.stream=st;v.srcObject=st;v.style.display='block';await v.play();msg.textContent='Looking for a QR code…';
    const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
    const got=t=>t&&t.startsWith('RST1:')&&importCode(t,Date.now());
    const loop=async()=>{
      if(!my.on)return;
      try{
        if(v.videoWidth){
          if(det){const r=await det.detect(v);if(r.length&&got(r[0].rawValue))return}
          else{const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);
            const r=jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});if(r&&got(r.data))return}
        }
      }catch(e){}
      setTimeout(loop,80);
    };
    loop();
  }catch(e){if($('#sm'))$('#sm').textContent='Camera isn’t available — allow camera access in Settings, or paste the code instead.'}
}

// ---- Live sync (Firebase Realtime Database) ----------------------------------------------------
// Helpers write their splits to  races/<raceId>/h/<helperId>  and the organizer listens on  races/<raceId>/h.
// Every helper tap is also stored on the phone (S.hm in localStorage). S.lv.dirty means "there are splits
// that the server hasn't confirmed yet"; it is only cleared when the server acknowledges the write, so
// nothing is lost if the signal drops or the app is closed, and it uploads itself when a connection returns.
// Offline mode (S.offline) switches all of this off and leaves the QR flow exactly as it was.
const FBV='10.14.1'; // keep in step with sw.js
const FB={db:null,conn:false,so:null,load:null,gone:0,push:0,org:null,ref:null,cb:null,last:0};
const LV={remote:{},pend:false,t:0,err:'',osent:'',srid:'',ot:0};
// Helper-side mirror of what the organizer publishes (race clock, goals, everyone's splits) at races/<id>/h/_org (inside the helper area, so the original database rules already allow it)
const HO={m:null,off:null,ref:null,cb:null,rid:null,lr:0,sp:false,closed:false};
const isH=()=>S.phase[0]==='h';
const fbOK=()=>{const c=window.FB_CONFIG;return !!(c&&c.databaseURL&&c.apiKey&&!/PASTE|YOUR/i.test(c.databaseURL+c.apiKey))};
const liveOn=()=>fbOK()&&!S.offline;

// One place for every Firebase failure: remembers it for the status line and tells the person once.
function liveErr(e){
  const c=(e&&e.code)||'error';LV.err=c;
  if(LV.shown!==c){LV.shown=c;setFlash(c==='PERMISSION_DENIED'?'Live sync blocked — access code expired, or database rules need updating':'Live sync problem ('+c+')')}

}
function setOffline(v){

    return;

}
function offToggle(withStatus){
  return `<label class="chk"><input type="checkbox" id="offm" ${S.offline?'checked':''}><span>Offline mode (no internet, QR only)</span></label>`+(withStatus===false?'':`<p class="hint" id="lvs">${esc(liveStatus().t)}</p>`);
}
function bindOff(){const c=$('#offm');if(c)c.onchange=()=>setOffline(c.checked)}
function liveBadge(){
  if(!(S.phase==='race'||S.phase==='done'||S.phase==='htime'))return;
  const h=document.querySelector('#app h1');if(!h)return;
  h.insertAdjacentHTML('afterend','<p class="hint lvb" id="lvb"></p>');
  updLive();
}
function updLive(){const t=liveStatus().t,a=$('#lvs'),b=$('#lvb');if(a)a.textContent=t;if(b)b.textContent=t}
const nTaps=()=>S.hm.reduce((a,k)=>a+k.taps.length,0);
function liveStatus(){
  const h=isH(),run=S.phase==='race'||S.phase==='done';
  if(S.offline||!(h?S.hinv:run)){LV.nc=0;LV.ncs=0}
  if(!fbOK())return{t:'Live sync isn’t set up in this copy of the app — use QR codes.'};
  if(S.offline){
    if(h)return{t:nTaps()&&S.lv.dirty?'Offline mode — splits stay on this phone. Use Send to organizer (QR) to share them.':'Offline mode — use Send to organizer (QR).'};
    return{t:'Offline mode — import helper results with QR codes.'};
  }
  if(LV.err)return{t:'Live sync blocked ('+LV.err+') — the access code may have expired, or the database rules need updating.'};
  if(!h&&!hasLive())return{t:'Live sync needs an access code on this phone — helpers and QR codes work without one. Uncheck Offline mode and enter a code to publish.'};
  if(!h&&!run)return{t:'Live sync on — helper splits arrive automatically once the race starts. QR still works too.'};
  if(h&&!S.hinv)return{t:'Live sync on — scan the organizer’s invite and your splits upload automatically.'};
  if(!FB.db||!FB.conn){
    if(!LV.nc)LV.nc=Date.now();
    const slow=Date.now()-LV.nc>10000,n=nTaps();
    if(slow)return{t:'Can’t reach live sync — turn off any VPN or ad blocker, or try cellular.'+(h?(n?` ${n} split${n===1?'':'s'} saved on this phone and will upload when connected.`:' Splits are saved on this phone.'):' Helper splits will appear once connected.')};
    if(!h)return{t:'No connection — helper splits will appear when you’re back online.'};
    return{t:n?`No connection — ${n} split${n===1?'':'s'} saved on this phone, uploading automatically when you’re back online.`:'No connection — splits are saved on this phone and upload automatically when you’re back online.'};
  }
  if(h)return{t:S.lv.dirty?'Live — uploading…':'Live — all splits uploaded ✓'};
  const c=Object.values(LV.remote||{}).filter(x=>x&&x.m).length;
  return{t:'Live — '+(c?c+' helper'+(c===1?'':'s')+' sending':'waiting for helpers')};
}

function ensureFB(){
  if(FB.db&&FB.conn)return Promise.resolve(true);
  if(FB.db&&!FB.conn){
    // SDK already loaded; wait briefly for the connected flag
    return new Promise(ok=>{
      let n=0;
      const t=setInterval(()=>{
        if(FB.conn){clearInterval(t);ok(true)}
        else if(++n>40){clearInterval(t);ok(!!FB.db)}
      },100);
    });
  }
  if(FB.load)return FB.load;
  if(Date.now()-FB.last<6000)return Promise.resolve(false);
  FB.last=Date.now();
  const base='https://www.gstatic.com/firebasejs/'+FBV+'/';
  const ld=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>{s.remove();no(new Error('load'))};document.head.appendChild(s)});
  const p=(async()=>{
    try{
      if(!window.firebase)await ld(base+'firebase-app-compat.js');
      if(!firebase.database)await ld(base+'firebase-database-compat.js');
      if(!firebase.apps.length)firebase.initializeApp(window.FB_CONFIG);
      FB.db=firebase.database();
      FB.db.ref('.info/connected').on('value',s=>{FB.conn=!!s.val();if(FB.conn){LV.nc=0;LV.ncs=0;LV.err='';updLive();liveStep()}});
      FB.db.ref('.info/serverTimeOffset').on('value',s=>{FB.so=s.val()});
      // Wait up to ~4s for the first connected=true so the first publish isn't skipped
      await new Promise(ok=>{
        if(FB.conn)return ok();
        let n=0;
        const t=setInterval(()=>{if(FB.conn||++n>40){clearInterval(t);ok()}},100);
      });
      return true;
    }catch(e){FB.db=null;return false}
  })();
  FB.load=p;p.then(()=>{FB.load=null});
  return p;
}

// Decides what this phone should be doing right now (listening, uploading, or nothing). Safe to call any time.
async function liveStep(){
  const run=(S.phase==='race'||S.phase==='done')&&!!S.rid,want=isH()?!!S.hinv:run;
  if(!want||!fbOK()){orgDetach();hDetach();updLive();return}
  if(S.offline&&!FB.db){updLive();return}
  if(!(await ensureFB())){updLive();return}
  if(S.offline){if(!FB.gone){FB.db.goOffline();FB.gone=1;FB.conn=false}updLive();return}
  if(FB.gone){FB.db.goOnline();FB.gone=0}
  if(isH()){orgDetach();liveFlush();hAttach()}else{hDetach();if(hasLive()){orgAttach();orgPublish()}else orgDetach()}
  updLive();
}
// Called from render(): notices helper changes (new tap, undo, reorder) and marks them as not yet uploaded.
function liveTick(){
  const L=S.lv;
  if(isH()){
    if(S.hinv&&(!HO.m||HO.rid!==S.hinv.r)){HO.rid=S.hinv.r;HO.m=null;HO.off=null;HO.closed=false;if(S.lv.o&&S.lv.o.r===HO.rid){try{HO.m=JSON.parse(S.lv.o.d);HO.off=S.lv.o.off;HO.closed=!!S.lv.o.closed||(HO.m&&HO.m.ph==='done')}catch(e){}}}
    if(S.hinv&&S.hm){
      const core=hCore(),sig=JSON.stringify(core);
      if(sig!==L.sig){const first=!L.sig&&!Object.keys(core.m).length;L.sig=sig;if(!first){L.ver++;L.dirty=1}}
    }
  }else if(L.orid!==S.rid){L.orid=S.rid;L.src={};L.hts={}}
  liveStep();
}

// ---- helper side: upload ----
function hCore(){
  const m={};
  S.hm.forEach(k=>{if(k.taps.length)m['k'+k.idx]={a:k.actual.slice(0,k.taps.length),t:k.taps,rv:k.rv||0}});
  return{m,A:S.hinv.A==null?null:Math.round(S.hinv.A)};
}
async function liveFlush(){
  const L=S.lv;
  if(!L.dirty||!S.hinv||!L.hid||!liveOn()||FB.push)return;
  if(!FB.db||!FB.conn)return;
  const v=L.ver,core=hCore(),path='races/'+S.hinv.r+'/h/'+L.hid;
  FB.push=1;
  let fin=false;
  const done=ok=>{
    if(fin)return;fin=true;clearTimeout(to);FB.push=0;
    if(ok){LV.err='';if(S.lv===L&&L.ver===v){L.dirty=0;saveState()}}
    updLive();
    if(S.lv===L&&L.dirty)setTimeout(liveStep,ok?60:4000);
  };
  const to=setTimeout(()=>done(false),12000);
  try{
    await FB.db.ref(path).set({...core,off:FB.so==null?null:FB.so,ts:firebase.database.ServerValue.TIMESTAMP});
    done(true);
  }catch(e){liveErr(e);done(false)}
}

// ---- organizer -> helpers: race clock, goals and everyone's splits ----
// Each live race is tagged with the organizer's access code (races/{rid}/k, not readable by helpers).
// The database rules only accept helper and organizer writes for a race whose code exists and hasn't expired.
function ensureRaceKey(rid){
  const code=liveCode(),key=rid+'|'+code;
  if(LV.krid===key)return Promise.resolve();
  if(!code)return Promise.reject({code:'PERMISSION_DENIED'});
  return FB.db.ref('races/'+rid+'/k').set(code).then(()=>{LV.krid=key});
}
function oCore(){
  const g={};S.order.forEach(p=>{if(S.goals[p.id]>0)g[p.id]=S.goals[p.id]});
  return{ph:S.phase,ep:S.epoch,fin:Math.round(S.final||0),tot:S.total===''?null:S.total,u:S.unit,g,
    o:S.order.map(p=>[p.id,p.name]),
    mk:S.markers.map(k=>[k.label,k.dist,k.unit||S.unit,k.actual,k.laps.map(x=>x==null?null:Math.round(x)),k.rv||0])};
}
// Sent as one JSON string so Firebase never reshapes the arrays; debounced, and re-sent after a reconnect.
function orgPublish(force){
  if(S.liveCleared||(LV.reap&&LV.reap===S.rid))return;
  if(!hasLive())return;
  if(!(S.phase==='race'||S.phase==='done')||!S.rid||!FB.db||S.offline)return;
  const d=JSON.stringify(oCore());
  if(!force&&d===LV.osent&&LV.srid===S.rid&&LV.krid===S.rid+'|'+liveCode())return;
  clearTimeout(LV.ot);
  const attempt=()=>{
    const rid=S.rid;
    if(!FB.db||!(S.phase==='race'||S.phase==='done')||S.offline)return;
    if(!FB.conn){LV.ot=setTimeout(attempt,500);return}
    const ts=(firebase.database&&firebase.database.ServerValue&&firebase.database.ServerValue.TIMESTAMP)||Date.now();
    try{
      ensureRaceKey(rid).then(()=>FB.db.ref('races/'+rid+'/h/_org').set({d,off:FB.so==null?null:FB.so,ts}))
        .then(()=>{LV.osent=d;LV.srid=rid;LV.err='';updLive()})
        .catch(e=>{liveErr(e);LV.ot=setTimeout(attempt,3000)});
    }catch(e){liveErr(e);LV.ot=setTimeout(attempt,3000)}
  };
  LV.ot=setTimeout(attempt,force?0:250);
}
function hAttach(){
  const rid=S.hinv.r;
  if(HO.ref&&HO.lrid===rid)return;
  hDetach();HO.lrid=rid;
  HO.ref=FB.db.ref('races/'+rid+'/h/_org');
  HO.cb=s=>{
    const v=s.val();LV.err='';
    if(v&&v.d){
      try{
        HO.m=JSON.parse(v.d);HO.rid=rid;HO.off=v.off==null?null:+v.off;
        HO.closed=HO.m.ph==='done';
        S.lv.o={r:rid,d:v.d,off:HO.off,closed:HO.closed};HO.sp=true;saveState();
      }catch(e){}
    }else if(HO.m){
      // Organizer cleared the race from Firebase — freeze on the last snapshot we have
      HO.closed=true;
      if(HO.m.ph!=='done')HO.m=Object.assign({},HO.m,{ph:'done'});
      if(S.lv.o)S.lv.o.closed=true;
      saveState();
    }
    updLive();hUpdate(true);
  };
  HO.ref.on('value',HO.cb,liveErr);
}
function hDetach(){if(HO.ref){try{HO.ref.off('value',HO.cb)}catch(e){}}HO.ref=null;HO.lrid=null}
// After finish: one last merge of helper data, then delete the race node so the database stays tidy.
async function orgCleanupRace(){
  if(!S.rid||!FB.db||S.liveCleared)return;
  LV.pend=true;try{pump()}catch(e){}
  orgPublish(true);
  await new Promise(r=>setTimeout(r,1000));
  const rid=S.rid;
  try{
    await FB.db.ref('races/'+rid).remove();
  }catch(e){
    // Fallback if rules only allow writes under h/*
    try{
      const snap=await FB.db.ref('races/'+rid+'/h').once('value');
      const u={};snap.forEach(c=>{u[c.key]=null});
      if(Object.keys(u).length)await FB.db.ref('races/'+rid+'/h').update(u);
    }catch(e2){liveErr(e2);setFlash('Race saved on this phone — could not clear live data');return}
  }
  S.liveCleared=true;orgDetach();LV.osent='';LV.srid='';LV.krid='';
  saveState();
  setFlash('Race saved on this phone · live data cleared');
  updLive();
}
// Deletes one race's live data (organizer clock, helper splits) from the database. Used when a race is discarded, or
// when a finished race was left behind without being cleared. Never throws; says why when it could not.
async function liveRemoveRace(rid){
  if(!rid||!fbOK())return{ok:false,why:'none'};
  if(S.offline)return{ok:false,why:'offline'};
  try{
    if(!(await ensureFB()))return{ok:false,why:'error'};
    if(FB.gone){FB.db.goOnline();FB.gone=0}
    const wait=(p)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),10000))]);
    try{await wait(FB.db.ref('races/'+rid).remove())}
    catch(e){
      // Fallback if the rules only allow writes under h/*
      const snap=await wait(FB.db.ref('races/'+rid+'/h').once('value'));
      const u={};snap.forEach(c=>{u[c.key]=null});
      if(Object.keys(u).length)await wait(FB.db.ref('races/'+rid+'/h').update(u));
    }
    return{ok:true};
  }catch(e){return{ok:false,why:'error'}}
}
// helper phone's clock -> organizer's clock
const hShift=()=>shiftCombine(S.hinv&&S.hinv.A!=null?+S.hinv.A:null,(HO.off!=null&&FB.so!=null)?(FB.so-HO.off):null);
const hElapsedAt=t=>HO.m?Math.max(0,t+hShift()-HO.m.ep):null;
function hElapsed(){const o=HO.m;if(!o||!S.hinv)return null;if(o.ph==='race')return Math.max(0,Date.now()+hShift()-o.ep);if(o.ph==='done')return o.fin;return null}
function hSlot(k,i){
  // Match organizer slots: main time + gap under it
  if(i>=k.taps.length)return'<span>—</span>';
  const el=hElapsedAt(k.taps[i]);
  const gap=i>0&&k.taps[i]!=null&&k.taps[i-1]!=null?'+'+fmt(k.taps[i]-k.taps[i-1]):'';
  if(el==null)return`<span>${i===0?'Leader':gap||'—'}</span>${gap&&i>0?'<small>'+gap+'</small>':''}`;
  return`<span>${fmt(el)}</span>${gap?'<small>'+gap+'</small>':''}`;
}
// Runs fn with the organizer's published race loaded into S, so goalState / recentPace / etc. work unchanged on a helper phone.
function withOrg(fn){
  const o=HO.m;if(!o)return null;
  const sv={markers:S.markers,goals:S.goals,total:S.total,unit:S.unit,cur:S.cur,phase:S.phase,start:S.start,final:S.final,order:S.order};
  const idx=S.hm[S.hc]?S.hm[S.hc].idx:0;
  try{
    S.markers=o.mk.map(([label,dist,unit,actual,laps,rv])=>({label,dist:dist==null?'':String(dist),unit,actual:actual||[],laps:laps||[],rv:rv||0}));
    S.goals=o.g||{};S.total=o.tot==null?'':String(o.tot);S.unit=o.u||'mi';
    S.cur=Math.max(0,Math.min(idx,S.markers.length-1));
    S.phase=o.ph==='race'?'race':'done';S.final=o.fin||0;
    S.start=performance.now()-(Date.now()+hShift()-o.ep);
    S.order=(o.o||[]).map(([id,name])=>({id,name}));
    return fn();
  }finally{Object.assign(S,sv)}
}
function hUpdate(force){
  if(HO.sp&&HO.m&&S.hinv&&isH()&&!busy()){

// Fold organizer/other-helper times into local taps, and adopt their timed order so rearranges sync both ways.
function hPullSplits(){
  if(!HO.m||!S.hm||!S.hm.length)return false;
  const sh=hShift(),ep=HO.m.ep;if(ep==null)return false;
  let ch=false;
  withOrg(()=>{
    S.hm.forEach(k=>{
      const m=S.markers[k.idx];if(!m)return;
      if((m.rv||0)>(k.rv||0)){
        // The organizer rearranged this marker more recently than we did: take its order and its times as they are.
        // (Places and times stay put; only names moved.) Splits we took that the organizer doesn't have yet keep their place.
        const nt=[];
        for(let i=0;i<m.laps.length&&m.laps[i]!=null;i++)nt.push(Math.round(+m.laps[i]-sh+ep));
        const have=new Set(k.actual.map(Number)),na=m.actual.map(Number).filter(id=>have.has(id));
        k.actual.forEach(id=>{if(!na.includes(+id))na.push(+id)});
        k.actual=na;k.taps=[...nt,...k.taps.slice(nt.length)];k.rv=m.rv;ch=true;return;
      }
      if((k.rv||0)>(m.rv||0)){
        // We rearranged more recently than the organizer knows: keep our order and times, and only pick up places the organizer has beyond ours.
        for(let i=k.taps.length;i<m.laps.length&&m.laps[i]!=null&&i<k.actual.length;i++){k.taps.push(Math.round(+m.laps[i]-sh+ep));ch=true}
        return;
      }
      const remote=new Map(),remoteOrder=[];
      m.actual.forEach((id,i)=>{
        if(m.laps[i]==null)return;
        id=+id;
        if(!remote.has(id))remoteOrder.push(id);
        remote.set(id,+m.laps[i]);
      });
      const local=new Map();
      for(let i=0;i<k.taps.length;i++)local.set(+k.actual[i],k.taps[i]);
      let added=0;
      remote.forEach((rel,id)=>{
        if(local.has(id))return;
        if(!k.actual.some(x=>+x===id))return;
        local.set(id,Math.round(rel-sh+ep));
        added++;
      });
      // Build timed list: organizer order first, then any local-only times
      const timed=[];
      remoteOrder.forEach(id=>{if(local.has(id)&&!timed.includes(id))timed.push(id)});
      k.actual.forEach(id=>{id=+id;if(local.has(id)&&!timed.includes(id))timed.push(id)});
      const rest=k.actual.filter(id=>!local.has(+id));
      const newTaps=timed.map(id=>local.get(id));
      const orderCh=timed.join()!==k.actual.slice(0,k.taps.length).join()||timed.length!==k.taps.length;
      if(!added&&!orderCh)return;
      k.actual=[...timed,...rest];
      k.taps=newTaps;
      ch=true;
    });
  });
  return ch;
}
// Estimated race time (ms) a runner reaches marker m: from their own recent pace (~), else the field's pace (≈).
function hEst(id,m,cd,gp){
  const r=recentPace(id);let pc=null,b=null,sy='';
  if(r){pc=r.pace;b={d:r.d,t:r.t};sy='~'}else if(gp!=null){pc=gp;b={d:0,t:0};sy='≈'}

}
const hGp=()=>{const ps=S.order.map(p=>recentPace(p.id)).filter(Boolean).map(i=>i.pace);return ps.length?ps.reduce((x,y)=>x+y,0)/ps.length:null};
// Bring the helper's runner list and marker list in line with the organizer's (renames, added or removed runners, added markers).
// A removed runner's tap is dropped too, because taps belong to a place in the list, not to a name.
function hSync(){
  const o=HO.m,inv=S.hinv;if(!o||!inv)return false;
  let ch=false;
  if(Array.isArray(o.o)&&o.o.length){
    const live=new Map(o.o);
    inv.o.filter(r=>!live.has(r[0])).forEach(r=>{
      S.hm.forEach(k=>{const i=k.actual.indexOf(r[0]);if(i<0)return;k.actual.splice(i,1);if(i<k.taps.length)k.taps.splice(i,1)});
      ch=true;

    inv.o=inv.o.filter(r=>live.has(r[0]));
    inv.o.forEach(r=>{const nm=live.get(r[0]);if(r[1]!==nm){r[1]=nm;ch=true}});
    o.o.forEach(([id,name])=>{if(!inv.o.some(r=>r[0]==id)){inv.o.push([id,name]);S.hm.forEach(k=>k.actual.push(id));ch=true}});
  }

// Per-runner line under each name — same layout as the organizer: goal in .gd, estimates/pace in .hi, row color from goal state.
function hRows(ms){

  withOrg(()=>{

    const ps=S.order.map(p=>recentPace(p.id)).filter(Boolean).map(i=>i.pace);

        if(D>0&&gp!=null){
          const r2=recentPace(id);let pc,b,sy;
          if(r2){pc=r2.pace;b={d:r2.d,t:r2.t};sy='~'}else{pc=gp;b={d:0,t:0};sy='≈'}
          if(D>b.d)parts.push('Fin '+sy+fmtE(b.t+pc*(D-b.d)));

}

// Times a helper supplied earlier are swapped for their latest version (so a helper fixing the order or undoing a tap
// carries through), but a time the organizer entered or edited themselves is never overwritten.
// Helper order of timed runners is respected so rearranging after splits updates the organizer.
function applyHelper(L,pairs,key,ts,rv){
  // Each helper upload carries a server timestamp. If it is the same upload we already merged, the helper has sent
  // nothing new, so its copy is older than anything the organizer has done since (like reordering) and must not overwrite it.
  if(!S.lv.hts)S.lv.hts={};
  if(ts!=null){if(S.lv.hts[key]===ts)return;S.lv.hts[key]=ts}
  rv=+rv||0;const lrv=+L.rv||0;
  if(rv>lrv){

    // Times only the organizer has (for runners this helper didn't time) are kept after them.
    const seen=new Set(),ids=[],laps=[],mineAll={};

    extra.sort((a,b)=>a[1]-b[1]);

    pairs.forEach(([id])=>{id=+id;if(!rest.includes(id)&&!seen.has(id))rest.push(id)});

    // only splits it took past what the organizer has are added, and they land in the next place (names follow the organizer's order).
    const mine={};

  L.actual.forEach((id,i)=>{if(L.laps[i]!=null){have.set(+id,L.laps[i]);orig.set(+id,L.laps[i])}});

  have.forEach((_,id)=>{if(!timed.includes(id))timed.push(id)});

  pairs.forEach(([id])=>{id=+id;if(!have.has(id)&&!rest.includes(id)&&!ordered.includes(id))rest.push(id)});

    if(helperOrder.length&&helperOrder.join()!==prevTimed.join()){
      L.actual=[...ordered,...rest];L.laps=ordered.map(id=>have.get(id));
    }
    return;
  }
  L.actual=[...ordered,...rest];L.laps=ordered.map(id=>have.get(id));
}

    b.style.display='block';const h=vv?vv.height:innerHeight,top=vv?vv.offsetTop:0;b.style.bottom=Math.max(8,innerHeight-(top+h)+8)+'px'};
  document.addEventListener('focusin',()=>setTimeout(place,50));
  document.addEventListener('focusout',()=>setTimeout(place,50));
  if(vv){vv.addEventListener('resize',place);vv.addEventListener('scroll',place)}
  b.addEventListener('pointerdown',e=>e.preventDefault());
  b.addEventListener('click',()=>{const a=document.activeElement;if(a&&a.blur)a.blur();place()});
  document.addEventListener('pointerdown',e=>{const a=document.activeElement;
    if(a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA')&&!e.target.closest('input,textarea,select,label,#kbd'))a.blur()});
})();
</script></body></html>
